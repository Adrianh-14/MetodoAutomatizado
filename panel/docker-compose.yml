services:
  postgres:
    image: postgres:16-alpine
    container_name: millonesgang-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: millonesgang
      POSTGRES_PASSWORD: M1ll0n3sG4ng_S3cur3!
      POSTGRES_DB: millonesgang_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millonesgang -d millonesgang_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: millonesgang-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://millonesgang:M1ll0n3sG4ng_S3cur3!@postgres:5432/millonesgang_db?schema=public
      DATABASE_URL_UNPOOLED: postgresql://millonesgang:M1ll0n3sG4ng_S3cur3!@postgres:5432/millonesgang_db?schema=public
      JWT_SECRET: m1ll0n3sg4ng_jwt_sup3r_s3cr3t_k3y_2025!
      JWT_REFRESH_SECRET: m1ll0n3sg4ng_r3fr3sh_sup3r_s3cr3t_k3y_2025!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost
      AUTOMATION_URL: http://automation:3002
      PORT: 3001
    ports:
      - "3001:3001"
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"

  automation:
    build:
      context: "./ProyectoMosivo Auto'"
      dockerfile: Dockerfile
    container_name: millonesgang-auto
    restart: unless-stopped
    environment:
      PORT: 3002
      DISPLAY: :99
    ports:
      - "3002:3002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: millonesgang-web
    restart: unless-stopped
    depends_on:
      - backend
      - automation
    ports:
      - "80:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: millonesgang-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@millonesgang.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
